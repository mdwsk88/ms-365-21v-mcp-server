services:
  mcp-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: ms-365-21v-mcp-server:local
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 3000
    ports:
      - "${MCP_DOCKER_PORT:-3000}:3000"
    volumes:
      - ./.tokens:/app/.tokens
