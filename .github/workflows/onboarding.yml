name: Onboarding

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  onboarding:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test setup and offline diagnostics without installing dependencies
        run: npm run test:onboarding
