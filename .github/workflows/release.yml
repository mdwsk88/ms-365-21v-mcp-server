name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Dockerfile'
      - 'docker-compose.release.yml'
      - 'scripts/smoke-container.mjs'
      - 'docs/releases/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Validate version and release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # JavaScript template literals must reach Node without shell expansion.
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import fs from "node:fs";
            const tag = process.env.RELEASE_TAG;
            assert.match(tag, /^v\d+\.\d+\.\d+$/);
            assert.equal(tag, `v${JSON.parse(fs.readFileSync("package.json")).version}`);
            assert.ok(fs.existsSync(`docs/releases/${tag}.md`));
          '
      - run: npm ci
      - run: npm run check:release
      - run: npm test
      - run: npm audit --omit=dev
      - run: docker build --tag mcp-release:test .
      - run: node scripts/smoke-container.mjs mcp-release:test

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'mdwsk88/ms-365-21v-mcp-server'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      IMAGE: ghcr.io/mdwsk88/ms-365-21v-mcp-server
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish versioned image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          sbom: true
          provenance: mode=max
      - name: Create release with deployment files
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p release-assets
          cp docker-compose.release.yml release-assets/
          cp .env.example release-assets/env.example
          printf '%s@%s\n' "$IMAGE" "$IMAGE_DIGEST" > release-assets/image-digest.txt
          (cd release-assets && sha256sum docker-compose.release.yml env.example image-digest.txt > SHA256SUMS)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
