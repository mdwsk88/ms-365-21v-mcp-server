services:
  mcp-gateway:
    image: ghcr.io/mdwsk88/ms-365-21v-mcp-server:${MCP_IMAGE_TAG:-v0.1.0}
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 3000
    ports:
      - "127.0.0.1:${MCP_DOCKER_PORT:-3000}:3000"
    volumes:
      - mcp-state:/app/.tokens

volumes:
  mcp-state:
